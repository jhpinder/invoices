# Business identity shown at the top of every invoice.
# Copy this file to config.yaml and fill in your own details.
# config.yaml is gitignored so personal info stays out of the repo.
business:
  name: "Your Name or Company"
  address: |
    123 Main Street
    City, ST 00000
  phone: "(555) 555-5555"
  email: "you@example.com"

# Theme file from themes/ used when an invoice doesn't specify one.
default_theme: organ-green

# One-line message at the bottom of every invoice.
footer: "Thank you for your business."
